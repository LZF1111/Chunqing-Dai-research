[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chunqing-dai-research"
version = "0.1.0"
description = "Reproducible autoresearch baselines for atmospheric remote sensing."
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3,<2",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
]

[tool.setuptools]
packages = ["src"]
